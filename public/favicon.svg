<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The game's logo: a cream skyline on teal. Drawn on a 4-unit grid, so every
       edge lands on a whole pixel at 16px and it stays sharp in a browser tab. -->
  <rect width="64" height="64" rx="12" fill="#17566a"/>
  <g fill="#f8e5bc">
    <rect x="8" y="28" width="8" height="28"/>
    <rect x="20" y="8" width="12" height="48"/>
    <path d="M36 24l4-4 4 4v32h-8z"/>
    <rect x="48" y="36" width="8" height="20"/>
    <rect x="51" y="30" width="2" height="6"/>
    <rect x="4" y="54" width="56" height="4" rx="1"/>
  </g>
</svg>
