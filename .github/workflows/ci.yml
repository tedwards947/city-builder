# Runs on every pull request and on main: the type-check, the tests, a
# production build and a sim speed check (numbers in the job summary; fails
# only on a large slowdown). A red cross on a PR means do not merge it yet.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
      - name: Sim speed
        run: |
          npm run -s bench -- --no-browser --json > bench.json
          node scripts/bench-check.mjs bench.json
