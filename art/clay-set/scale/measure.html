<!doctype html><meta charset="utf-8"><title>measure</title>
<style>body{margin:0;background:#2a2f36;color:#ddd;font:10px sans-serif}#g{display:flex;flex-wrap:wrap;gap:4px;padding:4px}figure{margin:0;text-align:center}canvas{display:block;background:#3a4048}</style>
<div id="g"></div>
<script type="module">
import { CLAY_SPRITE_DATA } from '/src/render/clay/claySpriteData.ts';
const out = [];
const g = document.getElementById('g');
for (const [name, m] of Object.entries(CLAY_SPRITE_DATA)) {
  const img = new Image(); img.src = `/sprites/clay/${name}.png`; await img.decode();
  const c = document.createElement('canvas'); c.width = m.w; c.height = m.h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, m.w, m.h).data;
  const plotW = m.right - m.left + 1, plotTop = m.bottom + 1 - plotW * 0.905;
  let top = m.h; for (let y = 0; y < m.h && top === m.h; y++) for (let i = 0; i < m.w; i++) if (d[(y * m.w + i) * 4 + 3] > 128) { top = y; break; }
  // building columns: opaque pixels above the plot top
  let l = m.w, r = -1; for (let y = 0; y < Math.floor(plotTop); y++) for (let i = 0; i < m.w; i++) if (d[(y * m.w + i) * 4 + 3] > 128) { l = Math.min(l, i); r = Math.max(r, i); }
  out.push({ name, plotW, rise: +((plotTop - top) / plotW).toFixed(3), widthAbove: r >= 0 ? +((r - l + 1) / plotW).toFixed(2) : 0 });
  x.strokeStyle = '#ff0'; x.beginPath(); x.moveTo(0, plotTop); x.lineTo(m.w, plotTop); x.stroke();
  const f = document.createElement('figure'); f.append(c, Object.assign(document.createElement('figcaption'), { textContent: `${name} ${out.at(-1).rise}` })); g.append(f);
}
window.__out = out;
</script>
